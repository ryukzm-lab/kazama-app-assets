<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>予約票(試)</title>
<meta name="apple-mobile-web-app-title" content="予約票(試)">
<link rel="apple-touch-icon" sizes="180x180" href="../yoyaku-icon-test-180.png">
<link rel="icon" type="image/png" href="../yoyaku-icon-test-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:28px 20px 48px;text-align:center}
img.ic{width:120px;height:120px;border-radius:27px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
h1{font-size:24px;margin:16px 0 4px}
.sub{color:#6e6e73;margin:0 0 20px}
ol{text-align:left;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:16px 16px 16px 38px;font-size:18px}
li{margin:10px 0}
.note{font-size:14px;color:#6e6e73;text-align:left}
a.btn{display:block;margin-top:18px;padding:16px;border-radius:12px;background:#0a64c8;color:#fff;text-decoration:none;font-size:18px}
</style>
</head>
<body>
<main id="open">
<img class="ic" src="../yoyaku-icon-test-180.png" alt="">
<h1>予約票(試)</h1>
<p class="sub">アプリを開いています…</p>
<a class="btn" href="https://script.google.com/macros/s/AKfycbyQJNQWTTwTAJV986y6VCHzkW4I6VKCTAGOoQcrC7CY_Ze8lBZ6Kp8dTpcJs6v-GBloQw/exec?test=1">開かないときはここを押す</a>
</main>
<main id="setup" hidden>
<img class="ic" src="../yoyaku-icon-test-180.png" alt="">
<h1>予約票(試)</h1>
<p class="sub">ホーム画面にアイコンを追加します</p>
<ol>
<li>画面の下（または上）にある<b>共有ボタン</b>（□に↑のマーク）を押す</li>
<li><b>「ホーム画面に追加」</b>を押す</li>
<li>「Webアプリとして開く」が出たら<b>オフ</b>にする</li>
<li>右上の<b>「追加」</b>を押す</li>
</ol>
<p class="note">追加すると、ホーム画面にこのアイコンが出ます。押すとアプリが開きます。</p>
<a class="btn" href="https://script.google.com/macros/s/AKfycbyQJNQWTTwTAJV986y6VCHzkW4I6VKCTAGOoQcrC7CY_Ze8lBZ6Kp8dTpcJs6v-GBloQw/exec?test=1">いまアプリを開く</a>
</main>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbyQJNQWTTwTAJV986y6VCHzkW4I6VKCTAGOoQcrC7CY_Ze8lBZ6Kp8dTpcJs6v-GBloQw/exec?test=1';
var isSetup=/[?&]setup(=|&|$)/.test(location.search);
if(isSetup){
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  document.getElementById('open').hidden=true;
  document.getElementById('setup').hidden=false;
}else{
  location.replace(EXEC);
}
</script>
</body>
</html>
